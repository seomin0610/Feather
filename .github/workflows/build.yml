name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # catalyst gets its own run, most of the background task code is compiled out there
        platform: [iphoneos, maccatalyst]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Cache Xcode build
        uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: deriveddata-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: deriveddata-${{ matrix.platform }}-
          deriveddata-directory: ${{ runner.temp }}/Feather/${{ matrix.platform }}
          swiftpm-cache-key: sourcepackages-${{ matrix.platform }}-${{ hashFiles('**/Package.resolved') }}
          restore-mtime-targets: |
            **/Package.swift
            **/*.xcconfig

      - name: Compile Feather
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/ci.xcconfig
        run: |
          echo 'COMPILATION_CACHE_ENABLE_CACHING = YES' > "$XCODE_XCCONFIG_FILE"
          make ${{ matrix.platform }} TMP=${{ runner.temp }}/Feather

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Feather-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
