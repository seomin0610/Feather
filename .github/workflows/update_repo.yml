name: Update Repository

on:
  release:
    types: [published]
    
permissions:
  contents: write
    
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: main

      - name: Dependencies
        run: brew install jq

      - name: Update app-repo.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DATE="${{ github.event.release.published_at }}"
          VERSION="${TAG#v}"
          NEWS_DATE="${DATE%%T*}"
          UPDATE_URL="https://signer.waterwave.space"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Feather.ipa"

          jq \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --arg url "$DOWNLOAD_URL" \
            --arg newsDate "$NEWS_DATE" \
            --arg updateUrl "$UPDATE_URL" \
            '
            .apps[0].version = $version |
            .apps[0].versionDate = $date |
            .apps[0].downloadURL = $url |
            .apps[0].versions = [{version: $version, date: $date, downloadURL: $url}] + .apps[0].versions |
            .news = [{
              title: ("Feather " + $version + " 업데이트"),
              identifier: ("feather-update-" + $version),
              caption: ("Feather has been updated to version " + $version + ". Visit " + "Web signer" + " to update."),
              tintColor: "8A28F7",
              url: $updateUrl,
              date: $newsDate,
              notify: true
            }] + .news
            ' app-repo.json > tmp.json

          mv tmp.json app-repo.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-repo.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore: update repo for ${{ github.event.release.tag_name }}"

          git push origin main
